name: Deploy Zen Task Flow to GitHub Pages
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build standalone app
        run: pnpm --filter @workspace/todo-app build
        env:
          GITHUB_PAGES: "true"
      - name: Support direct deep links on Pages
        run: cp artifacts/todo-app/dist/public/index.html artifacts/todo-app/dist/public/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/todo-app/dist/public
      - id: deployment
        uses: actions/deploy-pages@v4
